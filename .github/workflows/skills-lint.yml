name: Skills lint

on:
  pull_request:
    paths:
      - "skills/**"
      - "scripts/generate-supersaiyan-references.sh"
      - "scripts/generate-agent-configs.sh"
      - "scripts/lib/**"
      - "docs/templates/agent-blocks/**"
      - ".cursor/rules/**"
      - ".claude-plugin/**"
      - ".codex-plugin/**"
      - "scripts/setup-gstack-artifacts-path.sh"
      - "scripts/backends/**"
      - "scripts/super-board-run.sh"
      - "scripts/super-board-wave-plan.sh"
      - "scripts/super-board-status.py"
      - "scripts/config-resolve.sh"
      - "install.sh"
      - "scripts/bootstrap-app.sh"
      - "skills/supersaiyan/scripts/prepare.sh"
      - "skills/super-build/scripts/super-build-dispatch.sh"
      - "skills/super-qa/scripts/super-qa-dispatch.sh"
      - ".gitignore"
      - "tests/test-reference-sync.py"
      - "tests/test-backend-contract.sh"
      - "tests/test-build-safety-contract.sh"
      - "tests/test-worker-docs-platform-agnostic.sh"
      - "tests/test-multi-backend-dispatch.sh"
      - "tests/test-config-extends.sh"
      - "tests/test-config-root-fallback.sh"
      - "tests/test-status-json.py"
      - "tests/test-agent-config-sync.py"
      - "tests/test-md-block.sh"
      - "tests/test-glab-bootstrap.sh"
      - "tests/test-agents-md-install.sh"
      - "tests/test-platform-contract.sh"
      - "tests/test-gitlab-auth-boardread.sh"
      - "scripts/platforms/**"
      - ".github/workflows/skills-lint.yml"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/generate-supersaiyan-references.sh"
      - "scripts/generate-agent-configs.sh"
      - "scripts/lib/**"
      - "docs/templates/agent-blocks/**"
      - ".cursor/rules/**"
      - ".claude-plugin/**"
      - ".codex-plugin/**"
      - "scripts/setup-gstack-artifacts-path.sh"
      - "scripts/backends/**"
      - "scripts/super-board-run.sh"
      - "scripts/super-board-wave-plan.sh"
      - "scripts/super-board-status.py"
      - "scripts/config-resolve.sh"
      - "install.sh"
      - "scripts/bootstrap-app.sh"
      - "skills/supersaiyan/scripts/prepare.sh"
      - "skills/super-build/scripts/super-build-dispatch.sh"
      - "skills/super-qa/scripts/super-qa-dispatch.sh"
      - ".gitignore"
      - "tests/test-reference-sync.py"
      - "tests/test-backend-contract.sh"
      - "tests/test-build-safety-contract.sh"
      - "tests/test-worker-docs-platform-agnostic.sh"
      - "tests/test-multi-backend-dispatch.sh"
      - "tests/test-config-extends.sh"
      - "tests/test-config-root-fallback.sh"
      - "tests/test-status-json.py"
      - "tests/test-agent-config-sync.py"
      - "tests/test-md-block.sh"
      - "tests/test-glab-bootstrap.sh"
      - "tests/test-agents-md-install.sh"
      - "tests/test-platform-contract.sh"
      - "tests/test-gitlab-auth-boardread.sh"
      - "scripts/platforms/**"

jobs:
  reference-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/test-reference-sync.py

  backend-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/test-backend-contract.sh

  build-safety-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/test-build-safety-contract.sh

  worker-docs-platform-agnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/test-worker-docs-platform-agnostic.sh

  multi-backend-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/test-multi-backend-dispatch.sh

  config-extends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/test-config-extends.sh

  config-root-fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/test-config-root-fallback.sh

  status-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/test-status-json.py

  agent-config-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/test-agent-config-sync.py

  md-block:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/test-md-block.sh

  glab-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/test-glab-bootstrap.sh

  platform-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/test-platform-contract.sh

  gitlab-auth-boardread:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/test-gitlab-auth-boardread.sh

  agents-md-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/test-agents-md-install.sh
